# Proyecto Parcial 2 - CI/CD con despliegue condicionado a las pruebas y trazabilidad en OpenObserve.
#   obs-image ─┐
#   test ──────┼─> deploy (SOLO si test = success)  ->  report-deploy (siempre)
#      └──────────> report-tests (siempre)
# La imagen "app" se construye UNA vez en el job test (cache de capas en GitHub Actions), se prueba esa misma
# imagen con Playwright y, si todo pasa, se publica en GHCR con tag = commit SHA. La EC2 solo hace pull + up.
# Si las pruebas fallan, el job deploy queda en "skipped": NO hay conexion SSH hacia la EC2.
name: CI-CD

on:
  push:
    branches: [main, ci-optimizacion]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io/ce0s23
  APP_IMAGE: ghcr.io/ce0s23/proyecto2-app

jobs:
  # Imagen de observabilidad (OpenObserve + Collector): tag = hash de docker/observability, solo se construye si cambia.
  obs-image:
    name: Imagen observability
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=obs-$(echo '${{ hashFiles('docker/observability/**') }}' | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$REGISTRY/proyecto2-observability:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "La imagen ya existe en GHCR: no se reconstruye"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/observability/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/proyecto2-observability:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=observability
          cache-to: type=gha,mode=max,scope=observability

  test:
    name: Pruebas (lint, Jest, build, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      total: ${{ steps.counts.outputs.total }}
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
      skipped: ${{ steps.counts.outputs.skipped }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test?schema=public
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret' }}
      OTEL_SDK_DISABLED: 'true'
      LOG_LEVEL: silent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js ${{ env.NODE_VERSION }} (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependencias (backend + e2e)
        run: |
          (cd backend && npm ci --no-audit --no-fund && npx prisma generate) &
          (cd e2e && npm ci --no-audit --no-fund) &
          wait

      - name: Lint + typecheck (backend)
        working-directory: backend
        run: npm run lint && npm run typecheck

      # Jest no detiene el job: Playwright tambien se ejecuta y el veredicto final se toma
      # en "Veredicto de pruebas" (si Jest o Playwright fallan, el job falla y NO hay deploy).
      - name: Jest (unitarias + API con supertest)
        id: jest
        continue-on-error: true
        working-directory: backend
        run: npx prisma migrate deploy && npm run test:ci

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen app (frontend Angular + backend NestJS + NGINX), una sola vez
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          load: true
          push: false
          provenance: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Levantar ESA imagen + db con docker compose
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "JWT_SECRET=ci-$(openssl rand -hex 24)"
            echo "SEED_ADMIN_PASSWORD=Admin12345!"
            echo "OTEL_SDK_DISABLED=true"
            echo "GIT_COMMIT=${GITHUB_SHA}"
            echo "IMAGE_TAG=${GITHUB_SHA}"
          } >> .env
          docker compose up -d --no-build app db
          for i in $(seq 1 40); do
            if curl -fsS http://localhost/api/health; then echo; echo "App lista"; exit 0; fi
            sleep 2
          done
          docker compose logs app | tail -100
          exit 1

      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache de navegadores Playwright
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Instalar Chromium (solo si no hay cache)
        if: steps.pwcache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Playwright (E2E navegador + API)
        id: playwright
        continue-on-error: true
        working-directory: e2e
        env:
          BASE_URL: http://localhost
          CI: 'true'
        run: npx playwright test

      - name: Veredicto de pruebas (Jest + Playwright)
        run: |
          echo "Jest: ${{ steps.jest.outcome }} | Playwright: ${{ steps.playwright.outcome }}"
          if [ "${{ steps.jest.outcome }}" != "success" ] || [ "${{ steps.playwright.outcome }}" != "success" ]; then
            echo "::error::Fallaron pruebas automatizadas (Jest=${{ steps.jest.outcome }}, Playwright=${{ steps.playwright.outcome }}). Deploy bloqueado."
            exit 1
          fi

      - name: Publicar imagen probada en GHCR (tag = commit SHA)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$APP_IMAGE:$GITHUB_SHA"

      - name: Logs de la app (si algo fallo)
        if: failure()
        run: docker compose logs --tail=200 app || true

      - name: Contar pruebas (JUnit XML)
        id: counts
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob('backend/reports/*.xml') + glob.glob('e2e/reports/*.xml'):
              root = ET.parse(f).getroot()
              suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
              for s in suites:
                  total += int(s.get('tests', 0))
                  failed += int(s.get('failures', 0)) + int(s.get('errors', 0))
                  skipped += int(s.get('skipped', 0))
          print(f"total={total}")
          print(f"failed={failed}")
          print(f"skipped={skipped}")
          print(f"passed={total - failed - skipped}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Subir reportes JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            backend/reports/*.xml
            e2e/reports/*.xml
          if-no-files-found: warn

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: |
            e2e/reports/html
            e2e/test-results
          if-no-files-found: warn

  report-tests:
    name: Reportar pruebas a OpenObserve
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enviar evento test_run
        env:
          O2_URL: ${{ secrets.O2_URL }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PASSWORD: ${{ secrets.O2_PASSWORD }}
          STATUS: ${{ needs.test.result == 'success' && 'success' || 'failure' }}
          RESULT: ${{ needs.test.result }}
          TOTAL: ${{ needs.test.outputs.total || 0 }}
          PASSED: ${{ needs.test.outputs.passed || 0 }}
          FAILED: ${{ needs.test.outputs.failed || 0 }}
          SKIPPED: ${{ needs.test.outputs.skipped || 0 }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          payload=$(jq -n \
            --arg event "test_run" --arg status "$STATUS" --arg job_result "$RESULT" \
            --arg commit_sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg actor "$GITHUB_ACTOR" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" --arg repository "$GITHUB_REPOSITORY" \
            --arg commit_message "${COMMIT_MSG%%$'\n'*}" \
            --argjson tests_total "$TOTAL" --argjson tests_passed "$PASSED" \
            --argjson tests_failed "$FAILED" --argjson tests_skipped "$SKIPPED" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[{event:$event,status:$status,job_result:$job_result,commit_sha:$commit_sha,branch:$branch,actor:$actor,
               run_id:$run_id,run_number:$run_number,run_url:$run_url,workflow:$workflow,repository:$repository,
               commit_message:$commit_message,tests_total:$tests_total,tests_passed:$tests_passed,
               tests_failed:$tests_failed,tests_skipped:$tests_skipped,timestamp:$timestamp}]')
          echo "$payload"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 -X POST "$O2_URL/api/default/cicd_pipeline/_json" \
            -u "$O2_USER:$O2_PASSWORD" -H 'Content-Type: application/json' -d "$payload"

  deploy:
    name: Desplegar en AWS EC2
    needs: [test, obs-image]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Un solo despliegue a la vez hacia la EC2 (las corridas de test nunca se cancelan).
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH a EC2 -> commit exacto -> docker compose pull + up -d -> health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          SHA: ${{ github.sha }}
          OBS_TAG: ${{ needs.obs-image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SHA,OBS_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 8m
          script: |
            set -e
            cd /opt/app
            # Se despliega EXACTAMENTE el commit que paso las pruebas (no la punta de la rama).
            git fetch --prune --quiet origin
            git reset --hard "$SHA"
            sed -i '/^\(GIT_COMMIT\|IMAGE_TAG\|OBS_TAG\)=/d' .env
            printf 'GIT_COMMIT=%s\nIMAGE_TAG=%s\nOBS_TAG=%s\n' "$SHA" "$SHA" "$OBS_TAG" >> .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            docker compose pull --quiet app observability
            docker logout ghcr.io >/dev/null
            # Nada de build en la instancia: solo se usan las imagenes ya probadas en CI.
            docker compose up -d --no-build --remove-orphans
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-health-probe: 1' http://localhost/api/health || true)
              if [ "$code" = "200" ]; then echo "Health OK (200) tras $((i * 3)) s"; docker compose ps; docker image prune -f >/dev/null; exit 0; fi
              sleep 3
            done
            echo "La app no respondio 200 en /api/health en 60 s"; docker compose logs --tail=100 app; exit 1

  report-deploy:
    name: Reportar deploy a OpenObserve
    needs: [test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enviar evento deploy
        env:
          O2_URL: ${{ secrets.O2_URL }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PASSWORD: ${{ secrets.O2_PASSWORD }}
          STATUS: ${{ needs.deploy.result }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          payload=$(jq -n \
            --arg event "deploy" --arg status "$STATUS" \
            --arg ssh_executed "$([ "$STATUS" = skipped ] && echo false || echo true)" \
            --arg commit_sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg actor "$GITHUB_ACTOR" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" --arg target "ec2:$EC2_HOST" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[{event:$event,status:$status,ssh_executed:$ssh_executed,commit_sha:$commit_sha,branch:$branch,actor:$actor,
               run_id:$run_id,run_url:$run_url,workflow:$workflow,target:$target,timestamp:$timestamp}]')
          echo "$payload"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 -X POST "$O2_URL/api/default/cicd_pipeline/_json" \
            -u "$O2_USER:$O2_PASSWORD" -H 'Content-Type: application/json' -d "$payload"
