# OpenTelemetry Collector: OTLP de la app (NGINX + NestJS) + metricas del host (hostmetrics) -> OpenObserve
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Metricas de la instancia EC2 leyendo /proc y /sys del host montados en /hostfs (solo lectura)
  hostmetrics:
    root_path: /hostfs
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load: {}
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: {}
      disk: {}
      filesystem:
        exclude_mount_points:
          mount_points: ["/dev/*", "/proc/*", "/sys/*", "/run/*", "/var/lib/docker/*", "/snap/*", "/boot/efi"]
          match_type: regexp
        exclude_fs_types:
          fs_types: ["autofs", "binfmt_misc", "bpf", "cgroup2", "configfs", "debugfs", "devpts", "devtmpfs", "fusectl", "hugetlbfs", "mqueue", "nsfs", "overlay", "proc", "procfs", "pstore", "rpc_pipefs", "securityfs", "selinuxfs", "squashfs", "sysfs", "tracefs", "tmpfs"]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true
      paging: {}
      processes: {}

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
    spike_limit_mib: 50
  batch:
    timeout: 5s
    send_batch_size: 1024
  resource/host:
    attributes:
      - key: host.name
        value: ${env:HOST_LABEL}
        action: upsert
      - key: cloud.provider
        value: aws
        action: upsert

exporters:
  otlphttp/openobserve:
    endpoint: http://127.0.0.1:5080/api/default
    headers:
      Authorization: Basic ${env:O2_BASIC_AUTH}
      stream-name: default
  otlphttp/openobserve_logs:
    endpoint: http://127.0.0.1:5080/api/default
    headers:
      Authorization: Basic ${env:O2_BASIC_AUTH}
      stream-name: app_logs
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve]
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resource/host, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/openobserve_logs]
