; Procesos del contenedor de observabilidad:
;  - openobserve: UI + API de ingesta en 0.0.0.0:5080
;  - otelcol: recibe OTLP (4317 gRPC / 4318 HTTP) y recolecta hostmetrics del host (/hostfs)
;  - thermal: sonda de temperatura (lee /hostfs/sys/class/thermal y hwmon; reporta N/D si no hay sensores)
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:openobserve]
command=/usr/local/bin/openobserve
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:otelcol]
command=/usr/local/bin/start-collector.sh
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:thermal]
command=/usr/bin/python3 -u /usr/local/bin/thermal_probe.py
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
