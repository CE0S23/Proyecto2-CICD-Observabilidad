load_module modules/ngx_otel_module.so;

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Log de acceso en JSON (stdout del contenedor)
  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","trace_id":"$otel_trace_id","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  # OpenTelemetry: NGINX crea el span raiz y propaga traceparent al backend.
  otel_exporter {
    endpoint ${OTEL_COLLECTOR_GRPC};
  }
  otel_service_name proyecto2-nginx;
  otel_trace on;
  otel_trace_context propagate;

  upstream backend {
    server 127.0.0.1:3000;
    keepalive 16;
  }

  server {
    listen 0.0.0.0:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy inverso: NGINX es la unica puerta de entrada a la API.
    location /api/ {
      otel_span_name "$request_method $uri";
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location = /api/health {
      otel_trace $otel_health;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Health-Probe $http_x_health_probe;
    }

    # SPA de Angular: cualquier ruta desconocida cae en index.html
    location / {
      otel_trace off;
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
      otel_trace off;
      expires 7d;
      add_header Cache-Control "public";
    }
  }

  # No trazar las sondas internas (header x-health-probe: 1)
  map $http_x_health_probe $otel_health {
    "1" off;
    default on;
  }
}
